<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS Example</title>

    <style>
        body{
            background-color: lightyellow;
            font-family: Arial;
            text-align: center;
        }

        h1{
            color: darkred;
        }

        p{
            color: green;
            font-size: 18px;
        }

        button{
            background-color: orange;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        button:hover{
            background-color: red;
        }
    </style>

</head>
<body>

    <h1>Welcome to My Website</h1>

    <p>This webpage is designed using Internal CSS.</p>

    <button>Click Here</button>

</body>
</html>
