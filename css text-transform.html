<!DOCTYPE html>
<html>
<head>
    <title>text-transform</title>
<style>
    h1{
        text-transform:uppercase;
    }
    h2{
        text-transform:capitalize;
    }
    p{
        text-transform:lowercase;
    }
</style>
</head>
<body>
    <h1>dr rvr nri university</h1>
    <h2>dr rvr nri university</h2>
    <p>dr rvr nri university</p>
</body>
</html>
